name: OdemeTakip
options:
  bundleIdPrefix: com.alpiysl
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  OdemeTakip:
    type: application
    platform: iOS
    sources:
      - OdemeTakip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alpiysl.odemetakip
        PRODUCT_NAME: OdemeTakip
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: OdemeTakip/Info.plist
      properties:
        CFBundleDisplayName: Ödeme Takip
        CFBundleDevelopmentRegion: tr
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
  OdemeTakipTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OdemeTakipTests
    dependencies:
      - target: OdemeTakip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alpiysl.odemetakip.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OdemeTakip:
    build:
      targets:
        OdemeTakip: all
        OdemeTakipTests: [test]
    run:
      config: Release
    test:
      config: Debug
      targets:
        - OdemeTakipTests
